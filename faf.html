<script>
const EMAIL    = "falfuhaid@tvtc.gov.sa";
const TELEGRAM = "https://t.me/ArarETC";

const COURSES = [
  { title: "تطبيقات الحاسب المتقدمة", url: "https://t.me/+TdM-vOF8SxvRNXcH", icon: "code" },
  { title: "مقدمة تطبيقات الحاسب",    url: "https://t.me/+wM1lmX7Phnk3NWZk", icon: "screen" },
  { title: "مبادئ شبكات الحاسب",      url: "https://t.me/+VOvn__WqUs0uEtEd", icon: "network" }
];

const CHANNELS = [
  { title: "قسم الحاسب وتقنية المعلومات", url: "https://t.me/computerdp",   icon: "telegram" },
  { title: "قسم التدرب الإلكتروني",       url: "https://linktr.ee/ArarETC", icon: "link" }
];
</script>
<!-- ===================== نهاية التعديل ===================== -->

<style>
  body { margin: 0; background: #0d2136; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #fff; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .page { position: relative; min-height: 100vh; overflow: hidden; }
  .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .bg img { position: absolute; top: -4%; left: -4%; width: 108%; height: 108%; object-fit: cover; filter: blur(3px) saturate(1.1) brightness(.92); }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(8,32,58,.42) 0%,rgba(14,44,72,.3) 34%,rgba(120,150,175,.22) 62%,rgba(200,214,224,.3) 100%); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 36%,rgba(0,0,0,0) 44%,rgba(4,18,34,.42) 100%); }
  .scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(180deg,rgba(4,14,26,.55) 0%,rgba(4,14,26,.34) 14%,rgba(4,14,26,.32) 62%,rgba(4,14,26,.42) 88%,rgba(4,14,26,.55) 100%); }
  .wrap { position: relative; z-index: 3; max-width: 440px; margin: 0 auto; padding: 22px 18px 34px; display: flex; flex-direction: column; gap: 20px; }
  .lockup { display: flex; align-items: center; gap: 10px; }
  .lockup img { width: 40px; height: 40px; object-fit: contain; flex: none; filter: brightness(0) invert(1); }
  .lockup span { font-size: 11px; line-height: 1.45; font-weight: 600; color: #f4f8fb; text-shadow: 0 1px 4px rgba(6,22,40,.55); }
  .lockup small { font-weight: 400; font-size: 11px; letter-spacing: .03em; }
  .panel { background: linear-gradient(160deg,rgba(10,28,48,.3),rgba(10,28,48,.18)); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); border: 1px solid rgba(255,255,255,.26); border-radius: 30px; box-shadow: 0 16px 40px rgba(18,48,73,.16), inset 0 1px 0 rgba(255,255,255,.32); padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .id-card { background: linear-gradient(160deg,rgba(10,28,48,.34),rgba(10,28,48,.2)); backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5); border: 1px solid rgba(255,255,255,.3); border-radius: 24px; box-shadow: 0 14px 34px rgba(6,20,36,.28), inset 0 1px 0 rgba(255,255,255,.35); padding: 18px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
  .id-card h1 { margin: 0; font-family: Changa, sans-serif; font-size: 23px; line-height: 1.4; font-weight: 600; }
  .id-card p { margin: 0; font-size: 12.5px; line-height: 1.6; font-weight: 500; color: #bcd3e3; }
  .head { display: flex; align-items: center; gap: 9px; padding: 0 4px 4px; }
  .head b { font-size: 18px; font-weight: 700; }
  .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; background: linear-gradient(160deg,rgba(10,28,48,.34),rgba(10,28,48,.2)); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid rgba(255,255,255,.24); border-right: 4px solid #4a9cd8; box-sizing: border-box; border-radius: 20px; padding: 11px 14px; min-height: 66px; box-shadow: 0 6px 18px rgba(18,48,73,.1), inset 0 1px 0 rgba(255,255,255,.35); }
  .row:hover { background: rgba(10,28,48,.46); }
  .row .ic { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #7fd0f0; }
  .row .t { font-size: 15.5px; font-weight: 700; line-height: 1.35; }
  .tiles { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  .tile { background: linear-gradient(160deg,rgba(10,28,48,.34),rgba(10,28,48,.2)); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid rgba(255,255,255,.24); box-sizing: border-box; border-radius: 22px; padding: 14px 10px; min-height: 74px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(18,48,73,.1), inset 0 1px 0 rgba(255,255,255,.35); }
  .tile:hover { background: rgba(10,28,48,.46); }
  .foot { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0 4px; }
  .foot i { width: 40px; height: 1px; background: rgba(255,255,255,.3); }
  .foot span { font-size: 12.5px; font-weight: 600; color: #cfe0ec; }
</style>
</head>
<body>
<div class="page">
  <div class="bg">
    <img src="assets/campus.jpg" alt="">
    <div class="tint"></div>
    <div class="vignette"></div>
  </div>
  <div class="scrim"></div>

  <div class="wrap">
    <div class="lockup">
      <img src="assets/logo.png" alt="شعار المؤسسة العامة للتدريب التقني والمهني">
      <span>المؤسسة العامة للتدريب التقني والمهني<br><small>Technical and Vocational Training Corporation</small></span>
    </div>

    <div class="id-card">
      <h1>م. فهد بن عبدالعزيز الفهيد</h1>
      <p>الكلية التقنية بعرعر — قسم الحاسب وتقنية المعلومات</p>
    </div>

    <div class="panel">
      <div class="head">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dceaf4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"></path></svg>
        <b>مقرراتي الدراسية</b>
      </div>
      <div id="courses"></div>
    </div>

    <div class="panel">
      <div class="head">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dceaf4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>
        <b>القنوات</b>
      </div>
      <div id="channels"></div>
    </div>

    <div class="panel">
      <div class="head">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dceaf4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-3.3-.5L3 21l1.6-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"></path></svg>
        <b>التواصل</b>
      </div>
      <div class="tiles">
        <a class="tile" id="mailTile" aria-label="البريد الإلكتروني" title="البريد الإلكتروني">
          <span class="ic" style="color:#9fd8f5"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m2 7 10 6 10-6"></path></svg></span>
        </a>
        <a class="tile" id="tgTile" target="_blank" rel="noopener" aria-label="التليجرام" title="التليجرام">
          <span class="ic" style="color:#67c7f0"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 3.3 11.5c-1 .4-1 1 .1 1.3l4.5 1.4 1.7 5.2c.2.6.4.7.9.3l2.5-2 4.6 3.4c.7.4 1.2.2 1.4-.6l3.3-15c.2-.9-.3-1.3-.4-.6Z"></path></svg></span>
        </a>
      </div>
    </div>

    <div class="foot">
      <i></i>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a9c6d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span>الكلية التقنية بعرعر</span>
      <i></i>
    </div>
  </div>
</div>

<script>
const ICONS = {
  code:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-12"></path><path d="m6 9-3 3 3 3"></path><path d="m18 9 3 3-3 3"></path></svg>',
  screen:   '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>',
  network:  '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"></path></svg>',
  data:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>',
  web:      '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .3-9 6 6 0 0 0-11.6-1.3A4.5 4.5 0 0 0 6.5 19h11Z"></path></svg>',
  telegram: '<svg width="27" height="27" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 3.3 11.5c-1 .4-1 1 .1 1.3l4.5 1.4 1.7 5.2c.2.6.4.7.9.3l2.5-2 4.6 3.4c.7.4 1.2.2 1.4-.6l3.3-15c.2-.9-.3-1.3-.4-.6Z"></path></svg>',
  link:     '<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>'
};
const CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7fa3bd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';

function render(id, items) {
  document.getElementById(id).innerHTML = items.map(it =>
    '<a class="row" href="' + it.url + '" target="_blank" rel="noopener" style="margin-bottom:12px">' +
      '<span class="ic">' + (ICONS[it.icon] || ICONS.code) + '</span>' +
      '<span class="t">' + it.title + '</span>' + CHEV +
    '</a>'
  ).join('');
}
render('courses', COURSES);
render('channels', CHANNELS);
document.getElementById('mailTile').href = 'mailto:' + EMAIL;
document.getElementById('tgTile').href = TELEGRAM;
</script>
</body>
</html>
